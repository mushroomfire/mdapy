name: Bug report
description: A wrong result, an error or a crash in MDAPY
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for reporting. The shortest code that shows the problem and the
        output of `mdapy.show_versions()` are what let us reproduce it.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code to reproduce
      description: >
        The shortest script that shows the problem and runs as it is: leave out
        everything else, and build the structure with `build_crystal` if the
        problem allows it. Otherwise attach the smallest file that shows it.
      render: python
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Full error message
      description: The whole traceback, not only its last line.
      render: text
  - type: textarea
    id: versions
    attributes:
      label: Output of mdapy.show_versions()
      description: >
        Run `python -c "import mdapy; mdapy.show_versions()"` and paste what it
        prints. MDAPY 1.x has no such function: give `mdapy.__version__`, the
        Python version and the operating system.
      render: text
    validations:
      required: true
