name: Documentation
description: Something in the documentation is wrong, missing or unclear
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      description: Its address, or what you were looking for if there is no page.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong, missing or unclear?
    validations:
      required: true
