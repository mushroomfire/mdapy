name: tests

on:
  push:
    branches: [master, v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: pytest — ${{ matrix.os }}, py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", werror: "ON" }
          - { os: ubuntu-latest, python: "3.14", werror: "ON" }
          - { os: macos-14, python: "3.13", werror: "ON" }
          # MSVC also warns inside third-party headers, so no -Werror here.
          - { os: windows-latest, python: "3.13", werror: "OFF" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: pip install ".[dev]" -Ccmake.define.MDAPY_WERROR=${{ matrix.werror }}
      - name: Test
        shell: bash
        run: pytest -q -n auto

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Editable install so that reported paths point into src/.
      - run: pip install -e ".[dev]"
      - name: Test with coverage (total >= 90 %)
        run: pytest -q --cov --cov-report=term --cov-report=json
      - name: Per-file coverage (each file >= 95 %)
        run: python tools/check_coverage.py coverage.json

  sanitizers:
    name: sanitizer — ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            preload: libasan.so libubsan.so
            options: >-
              ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
              UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          - sanitizer: thread
            preload: libtsan.so
            options: TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with ${{ matrix.sanitizer }} sanitizer
        run: >
          pip install ".[dev]"
          -Ccmake.define.MDAPY_SANITIZE=${{ matrix.sanitizer }}
          -Ccmake.build-type=RelWithDebInfo
      - name: Test under the sanitizer
        run: |
          preload=""
          for lib in ${{ matrix.preload }}; do preload="$preload:$(gcc -print-file-name=$lib)"; done
          export LD_PRELOAD="${preload#:}"
          export ${{ matrix.options }}
          pytest -q
