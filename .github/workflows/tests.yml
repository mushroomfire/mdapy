name: tests

on:
  push:
    branches: [master, v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: pytest — ${{ matrix.os }}, py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", werror: "ON" }
          - { os: ubuntu-latest, python: "3.14", werror: "ON" }
          - { os: macos-14, python: "3.13", werror: "ON" }
          # MSVC also warns inside third-party headers, so no -Werror here.
          - { os: windows-latest, python: "3.13", werror: "OFF" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: pip install ".[dev]" -Ccmake.define.MDAPY_WERROR=${{ matrix.werror }}
      - name: Test
        shell: bash
        run: pytest -q -n auto

  # 64-bit atom indices, the build for more than 2^31 - 1 atoms.
  index64:
    name: pytest — 64-bit indices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: pip install ".[dev]" -Ccmake.define.MDAPY_WERROR=ON -Ccmake.define.MDAPY_INDEX64=ON
      - name: Test
        run: |
          python -c "import mdapy; assert mdapy.index_dtype == 'int64'"
          pytest -q -n auto

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # LAMMPS for the LAMMPS calculator and the comparisons with LAMMPS: the
      # reference version, built once and kept as a wheel of its Python module.
      - uses: actions/cache@v4
        id: lammps
        with:
          path: lammps-wheel
          key: lammps-stable_30Sep2026-manybody-molecule-${{ runner.os }}-py3.13
      - name: Build LAMMPS
        if: steps.lammps.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch stable_30Sep2026 https://github.com/lammps/lammps.git
          cmake -S lammps/cmake -B lammps-build -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_SHARED_LIBS=on -D BUILD_MPI=no -D BUILD_OMP=no \
            -D PKG_MANYBODY=on -D PKG_MOLECULE=on -D Python_EXECUTABLE="$(which python)"
          cmake --build lammps-build -j 4
          cmake --build lammps-build --target install-python
          mkdir -p lammps-wheel && cp lammps-build/lammps-*.whl lammps-wheel/
      - run: pip install lammps-wheel/lammps-*.whl
      # Editable install so that reported paths point into src/.
      - run: pip install -e ".[dev]"
      - run: python -c "import lammps; assert lammps.lammps(cmdargs=['-screen', 'none', '-log', 'none']).version() == 20260930"
      - name: Test with coverage (total >= 90 %)
        run: pytest -q --cov --cov-report=term --cov-report=json
      - name: Per-file coverage (each file >= 95 %)
        shell: python
        run: |
          import json, sys
          files = json.load(open("coverage.json"))["files"]
          low = []
          for path, data in sorted(files.items()):
              percent = data["summary"]["percent_covered"]
              print(f"{percent:6.1f}%  {path}")
              if percent < 95.0:
                  low.append(path)
          if low:
              sys.exit("below 95 %: " + ", ".join(low))

  address-sanitizer:
    name: sanitizer — address
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >
          pip install ".[dev]"
          -Ccmake.define.MDAPY_SANITIZE=address
          -Ccmake.build-type=RelWithDebInfo
      - name: Test under the sanitizers
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)"
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          pytest -q

  # ThreadSanitizer checks the thread pool and the parallel kernels with a
  # C++ program: under a preloaded TSan, importing polars crashes on Linux,
  # so the Python test suite cannot run with it.
  thread-sanitizer:
    name: sanitizer — thread
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the thread checks with ThreadSanitizer
        run: >
          g++ -std=c++17 -O1 -g -fsanitize=thread -fno-omit-frame-pointer -ffp-contract=off
          -Wall -Wextra -Wpedantic -Wshadow -Werror -Isrc/cpp -pthread
          -o thread_checks src/cpp/core/parallel.cpp src/cpp/io/text.cpp
          src/cpp/neighbor/cell_list.cpp src/cpp/neighbor/kd_tree.cpp
          src/cpp/calculators/eam.cpp src/cpp/calculators/nep.cpp tests/cpp/thread_checks.cpp
      - name: Run them
        run: |
          # Recent kernels randomize mmap with 32 bits, which TSan does not expect.
          sudo sysctl -w vm.mmap_rnd_bits=28
          TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1 ./thread_checks
