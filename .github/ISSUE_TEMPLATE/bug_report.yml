name: Bug report
description: A wrong result, an error or a crash in MDAPY
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for reporting. The shortest code that shows the problem and the
        output of `mdapy.show_versions()` are what let us reproduce it.
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Python package
        - MDAPY application
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code to reproduce
      description: >
        The shortest script that shows the problem and runs as it is: leave out
        everything else, and build the structure with `build_crystal` if the
        problem allows it. Otherwise attach the smallest file that shows it. In
        the application, write the steps, and add its Python script (⌘P or
        Ctrl+P) if the problem is in a calculation.
      render: python
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Full error message
      description: >
        The whole traceback, not only its last line. In the application, a click
        on an error copies it.
      render: text
  - type: textarea
    id: versions
    attributes:
      label: Output of mdapy.show_versions()
      description: >
        Run `python -c "import mdapy; mdapy.show_versions()"` and paste what it
        prints. In the application: Help → System Information → Copy. MDAPY 1.x
        has no such function: give `mdapy.__version__`, the Python version and
        the operating system.
      render: text
    validations:
      required: true
