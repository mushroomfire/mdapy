site_name: mdapy
site_description: Molecular Dynamics Analysis in Python
repo_url: https://github.com/mushroomfire/mdapy
repo_name: mushroomfire/mdapy
edit_uri: edit/v2/docs/
copyright: Copyright &copy; 2022–2026 Yongchao Wu · BSD-3-Clause

theme:
  name: material
  logo: assets/mdapy-icon.svg
  favicon: assets/mdapy-icon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick tour: getting-started/quick-tour.md
      - Basics:
          - Systems and topology: getting-started/system.md
          - Simulation box: getting-started/box.md
          - Reading and writing files: getting-started/io.md
          - Trajectories: getting-started/trajectory.md
          - Neighbor lists: getting-started/neighbor.md
          - Parallelism: getting-started/parallelism.md
  - Simulation:
      - Calculators:
          - The calculator interface: simulation/calculators.md
          - EAM: simulation/eam.md
          - NEP: simulation/nep.md
          - LAMMPS: simulation/lammps.md
      - Minimization and dynamics:
          - Energy minimization: simulation/minimize.md
      - Lattice dynamics:
          - Elastic constants: simulation/elastic-constants.md
  - Reference:
      - File formats:
          - Extended XYZ: reference/formats/extxyz.md
          - LAMMPS data: reference/formats/lammps-data.md
          - LAMMPS dump: reference/formats/lammps-dump.md
          - VASP POSCAR: reference/formats/poscar.md
          - mdapy files: reference/formats/mdapy.md
      - Units and conventions: reference/units.md
      - Elements: reference/elements.md
      - Glossary: reference/glossary.md
      - References: reference/references.md
      - Python API: reference/api.md
  - Development:
      - Contributing: development/contributing.md
      - Source layout: development/source-layout.md
      - Release notes: development/release-notes.md
