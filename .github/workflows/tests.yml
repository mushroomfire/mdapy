name: tests

# Everything, when code changes. A change of the documentation alone runs
# doc-examples.yml instead, and does not cancel a run of this one.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - ".github/workflows/doc-examples.yml"
      - ".github/workflows/docs.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - ".github/workflows/doc-examples.yml"
      - ".github/workflows/docs.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: pytest — ${{ matrix.os }}, py${{ matrix.python }}${{ matrix.lowest && ', lowest NumPy and polars' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest of everything: the lowest Python, NumPy and polars that mdapy
          # accepts, so that its lower bounds are tested; the others take the newest
          - { os: ubuntu-latest, python: "3.11", werror: "ON", lowest: true }
          - { os: ubuntu-latest, python: "3.14", werror: "ON" }
          - { os: ubuntu-latest, python: "3.15", werror: "ON" }
          # Linux on ARM, for which wheels are published too
          - { os: ubuntu-24.04-arm, python: "3.13", werror: "ON" }
          - { os: macos-15, python: "3.13", werror: "ON" }
          # MSVC also warns inside third-party headers, so no -Werror here.
          - { os: windows-latest, python: "3.13", werror: "OFF" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # the headers of Vulkan, for the pictures on the GPU (no GPU here)
      - name: Vulkan headers
        if: runner.os == 'Linux'
        run: .github/ubuntu-dns.sh && sudo apt-get update -q && sudo apt-get install -y -q libvulkan-dev
      # the lower bounds of the dependencies in pyproject.toml, as exact versions
      - name: Lowest NumPy and polars
        if: matrix.lowest
        shell: bash
        run: |
          python -c "import tomllib; print('\n'.join(d.replace('>=', '==') for d in tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > lowest.txt
          cat lowest.txt
          echo "PIP_CONSTRAINT=$PWD/lowest.txt" >> "$GITHUB_ENV"
      - name: Install
        shell: bash
        run: pip install ".[dev]" -Ccmake.define.MDAPY_WERROR=${{ matrix.werror }}
      - name: Versions
        shell: bash
        run: python -c "import numpy, polars; print('NumPy', numpy.__version__, 'polars', polars.__version__)"
      # the public pseudopotentials of the tests of the DFT, downloaded once
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mdapy/tests
          key: dft-pseudopotentials-${{ runner.os }}-${{ hashFiles('tests/dft/public.py') }}
      - name: Test
        shell: bash
        run: pytest -q -n auto
      # Only the runner of macOS has a GPU: here the code and the shaders of Direct3D 12
      # and of Vulkan run on drivers on the processor, which pictures never use otherwise.
      - name: A Vulkan driver on the processor
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: sudo apt-get install -y -q libvulkan1 mesa-vulkan-drivers
      - name: Pictures on a driver on the processor
        if: runner.os == 'Windows' || (runner.os == 'Linux' && matrix.python == '3.14')
        shell: bash
        env:
          MDAPY_SOFTWARE_GPU: "1"
        run: |
          python -c "from mdapy.visualization import gpu_available; assert gpu_available()"
          pytest -q tests/visualization/test_render.py

  # 64-bit atom indices, the build for more than 2^31 - 1 atoms.
  index64:
    name: pytest — 64-bit indices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: pip install ".[dev]" -Ccmake.define.MDAPY_WERROR=ON -Ccmake.define.MDAPY_INDEX64=ON
      - name: Test
        run: |
          python -c "import mdapy; assert mdapy.index_dtype == 'int64'"
          pytest -q -n auto

  # MDAPY's dynamics split among processes under mpirun, against the run of one
  # process (tests/mpi); pytest checks the same with threads for processes
  # (tests/simulation/test_domain.py).
  mpi:
    name: pytest — MPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: OpenMPI and mpi4py
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openmpi-bin libopenmpi-dev
          pip install mpi4py
      - name: Install
        run: pip install . -Ccmake.define.MDAPY_WERROR=ON
      - name: Under mpirun
        env:
          MDAPY_NUM_THREADS: 1
        run: |
          for n in 1 2 3 4; do mpirun --oversubscribe -np $n python tests/mpi/check_bricks.py; done
          mpirun --oversubscribe -np 4 python tests/mpi/check_dynamics.py
          mpirun --oversubscribe -np 3 python tests/mpi/check_pimd.py
          mpirun --oversubscribe -np 4 python tests/mpi/check_minimize.py
          mpirun --oversubscribe -np 3 python tests/mpi/check_neb.py
          mpirun --oversubscribe -np 4 python tests/mpi/check_comm.py

  # The GPU part, mdapy-cuda12, compiled for one architecture with CUDA 12.9 and
  # GCC, warnings as errors: the module _cuda and the DFT, _dft, which needs the
  # development files of cuBLAS, cuFFT and cuSOLVER (and cuSPARSE and nvJitLink,
  # which cuSOLVER needs) to build. The runner has no GPU: the modules are only
  # loaded, _dft with the libraries of NVIDIA's packages that the extra dft
  # installs. Their tests run on a machine with a GPU.
  cuda:
    name: build — CUDA 12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: CUDA 12.9
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-12-9 cuda-cudart-dev-12-9 cuda-cccl-12-9 \
            libcublas-dev-12-9 libcufft-dev-12-9 libcusolver-dev-12-9 libcusparse-dev-12-9 libnvjitlink-dev-12-9
          echo /usr/local/cuda-12.9/bin >> "$GITHUB_PATH"
      - name: Build mdapy-cuda12 for one architecture
        run: pip install ./cuda12 -Ccmake.define.CMAKE_CUDA_ARCHITECTURES=86-real -Ccmake.define.MDAPY_WERROR=ON
      # _cuda names no library of CUDA: molecular dynamics needs only the driver
      - name: The libraries the modules name
        run: |
          site=$(python -I -c "import mdapy_cuda12, os; print(os.path.dirname(mdapy_cuda12.__file__))")
          readelf -d "$site"/_cuda*.so | grep NEEDED
          if readelf -d "$site"/_cuda*.so | grep -E "NEEDED.*(cudart|cublas|cufft|cusolver|cusparse|nvJitLink)"; then
            echo "_cuda names a library of CUDA"; exit 1
          fi
          readelf -d "$site"/_dft*.so | grep -E "NEEDED|RUNPATH"
          readelf -d "$site"/_dft*.so | grep 'RUNPATH.*\$ORIGIN/../nvidia/cusolver/lib' > /dev/null
      # NVIDIA's packages, as the extra dft of MDAPY gives them
      - name: NVIDIA's cuBLAS, cuFFT and cuSOLVER
        run: pip install "nvidia-cublas-cu12>=12.1.3.1" "nvidia-cufft-cu12>=11.0.2.54" "nvidia-cusolver-cu12>=11.4.5.107"
      - name: Load it
        run: python -I cuda12/check_import.py

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # LAMMPS for the LAMMPS calculator and the comparisons with LAMMPS: the
      # reference version, built once and kept as a wheel of its Python module.
      - uses: actions/cache@v4
        id: lammps
        with:
          path: lammps-wheel
          key: lammps-stable_30Sep2026-manybody-meam-molecule-extra-compute-extra-fix-extra-pair-shock-voronoi-diffraction-${{ runner.os }}-py3.13
      - name: Build LAMMPS
        if: steps.lammps.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch stable_30Sep2026 https://github.com/lammps/lammps.git
          cmake -S lammps/cmake -B lammps-build -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_SHARED_LIBS=on -D BUILD_MPI=no -D BUILD_OMP=no \
            -D PKG_MANYBODY=on -D PKG_MEAM=on -D PKG_MOLECULE=on -D PKG_EXTRA-COMPUTE=on \
            -D PKG_EXTRA-FIX=on -D PKG_EXTRA-PAIR=on -D PKG_SHOCK=on -D PKG_DIFFRACTION=on \
            -D PKG_VORONOI=on -D DOWNLOAD_VORO=on -D Python_EXECUTABLE="$(which python)"
          cmake --build lammps-build -j 4
          cmake --build lammps-build --target install-python
          mkdir -p lammps-wheel && cp lammps-build/lammps-*.whl lammps-wheel/
      - run: pip install lammps-wheel/lammps-*.whl
      # Editable install so that reported paths point into src/.
      - run: pip install -e ".[dev]"
      - name: Check the LAMMPS version and packages
        run: |
          python -c "
          import lammps
          lmp = lammps.lammps(cmdargs=['-screen', 'none', '-log', 'none'])
          assert lmp.version() == 20260930, lmp.version()
          missing = {'DIFFRACTION', 'EXTRA-COMPUTE', 'EXTRA-FIX', 'EXTRA-PAIR', 'MANYBODY', 'MOLECULE', 'SHOCK', 'VORONOI'} - set(lmp.installed_packages)
          assert not missing, missing
          "
      # OVITO for the comparisons with OVITO, at its reference version
      - run: pip install ovito==3.17.1
      # freud at its reference version for the comparisons with it, and
      # pymatgen for the conversions
      - run: pip install freud-analysis==3.6.1 pymatgen-core
      # s-dftd3 at its reference version for the comparisons of D3
      - run: pip install dftd3==1.7.0
      # phonopy for the comparisons of phonons, phono3py for those of the
      # thermal conductivity (pinned together: a newer phono3py upgrades
      # phonopy), seekpath for the paths
      - run: pip install phonopy==4.8.6 phono3py==4.8.2 symfc==1.7.3 seekpath==2.2.2
      # DScribe for the comparisons of SOAP, at its reference version
      - run: pip install dscribe==2.1.2
      # QUESTS for the comparisons of its descriptor and entropy, at its
      # reference version
      - run: pip install quests==2026.2.22
      # atomsk for the comparisons of the structure builder, at its reference
      # version, built once; it needs the Fortran and LAPACK libraries to run
      - run: .github/ubuntu-dns.sh && sudo apt-get update -q && sudo apt-get install -y -q gfortran liblapack-dev
      - uses: actions/cache@v4
        id: atomsk
        with:
          path: atomsk-bin
          key: atomsk-Beta-0.13.1-${{ runner.os }}
      - name: Build atomsk
        if: steps.atomsk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch Beta-0.13.1 https://github.com/pierrehirel/atomsk.git
          make -C atomsk/src -j 4 atomsk
          mkdir -p atomsk-bin && cp atomsk/src/atomsk atomsk-bin/
      - run: echo "$PWD/atomsk-bin" >> "$GITHUB_PATH"
      - run: atomsk --version | grep -q "Beta 0.13.1"
      - run: python -c "import ovito; assert ovito.version_string == '3.17.1'"
      # the public pseudopotentials of the tests of the DFT, downloaded once
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mdapy/tests
          key: dft-pseudopotentials-${{ runner.os }}-${{ hashFiles('tests/dft/public.py') }}
      - name: Test with coverage (total >= 90 %)
        run: pytest -q -n auto --cov --cov-report=term --cov-report=json --cov-report=xml
      - name: Report the coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
      - name: Per-file coverage (each file >= 95 %)
        shell: python
        run: |
          import json, sys
          # The compute path of the DFT runs only in the GPU part on a GPU,
          # which this runner lacks: the coverage of these files is measured
          # on a machine with a GPU (pytest --cov tests/dft), and the rule
          # leaves them out here.
          gpu = {
              "src/mdapy/calculators/_dft/calculator.py",
              "src/mdapy/calculators/_dft/scf.py",
          }
          files = json.load(open("coverage.json"))["files"]
          if gpu - files.keys():
              sys.exit("not in the report: " + ", ".join(sorted(gpu - files.keys())))
          low = []
          for path, data in sorted(files.items()):
              percent = data["summary"]["percent_covered"]
              print(f"{percent:6.1f}%  {path}" + ("  (on a GPU)" if path in gpu else ""))
              if percent < 95.0 and path not in gpu:
                  low.append(path)
          if low:
              sys.exit("below 95 %: " + ", ".join(low))

  address-sanitizer:
    name: sanitizer — address
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >
          pip install ".[dev]"
          -Ccmake.define.MDAPY_SANITIZE=address
          -Ccmake.build-type=RelWithDebInfo
      - name: Test under the sanitizers
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)"
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          # the workers of pytest-xdist inherit the preloaded sanitizers; the
          # examples of the documentation, the same code at larger sizes that
          # the other jobs run, are left out (under the sanitizers their
          # pictures alone took 50 minutes)
          pytest -q -n auto --durations=15 --ignore=tests/test_docs.py

  # ThreadSanitizer checks the thread pool and the parallel kernels with a
  # C++ program: under a preloaded TSan, importing polars crashes on Linux,
  # so the Python test suite cannot run with it.
  thread-sanitizer:
    name: sanitizer — thread
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the thread checks with ThreadSanitizer
        run: >
          g++ -std=c++17 -O1 -g -fsanitize=thread -fno-omit-frame-pointer -ffp-contract=off
          -Wall -Wextra -Wpedantic -Wshadow -Werror -Isrc/cpp -pthread
          -o thread_checks src/cpp/core/parallel.cpp src/cpp/io/text.cpp
          src/cpp/neighbor/*.cpp src/cpp/calculators/*.cpp
          src/cpp/identify/*.cpp src/cpp/analysis/*.cpp
          src/cpp/build/*.cpp src/cpp/visualization/*.cpp tests/cpp/thread_checks.cpp
      - name: Run them
        run: |
          # Recent kernels randomize mmap with 32 bits, which TSan does not expect.
          sudo sysctl -w vm.mmap_rnd_bits=28
          TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1 ./thread_checks

  # libFuzzer on the kernels of text files (tests/fuzz): any text is read or
  # refused without a fault, numbers agree with strtod bit for bit and come back
  # unchanged when written, tables come back unchanged. A minute for each.
  fuzz:
    name: fuzz — text kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Clang with libFuzzer
        run: .github/ubuntu-dns.sh && sudo apt-get update -q && sudo apt-get install -y -q clang-18 libclang-rt-18-dev
      - name: Build
        run: |
          for target in numbers table; do
            clang++-18 -std=c++17 -O1 -g -fsanitize=fuzzer,address,undefined \
              -fno-sanitize-recover=undefined -ffp-contract=off -Isrc/cpp \
              -o fuzz_$target tests/fuzz/fuzz_$target.cpp src/cpp/core/parallel.cpp src/cpp/io/text.cpp
          done
      - name: Run
        run: |
          for target in numbers table; do
            mkdir -p corpus_$target
            ./fuzz_$target -max_total_time=60 -print_final_stats=1 corpus_$target
          done
