[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "mdapy"
dynamic = ["version"]
description = "Analysis and modelling of atomistic simulations"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Yongchao Wu", email = "934313174@qq.com" }]
dependencies = ["numpy>=2.3.1", "polars>=2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
ase = ["ase>=3.22"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "coverage>=7.10",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/mushroomfire/mdapy"
Issues = "https://github.com/mushroomfire/mdapy/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# One abi3 wheel per platform for Python >= 3.12; older Pythons get
# version-specific wheels.
wheel.py-api = "cp312"
cmake.build-type = "Release"
sdist.exclude = [".github", "docs", "tests", "mkdocs.yml"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/mdapy/__init__.py"
regex = '__version__ = "(?P<value>[^"]+)"'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
# test packages share helpers, such as lattices.py and calculators.eam_files
pythonpath = ["tests"]
xfail_strict = true
# Warnings are errors: an unexpected warning is a test failure. Add
# targeted ignores here, each with a comment saying why.
filterwarnings = [
    "error",
    # OVITO from PyPI in a conda Python, as in local test environments, works
    # but warns on import
    "ignore:Did you accidentally install the OVITO package:UserWarning",
]

[tool.coverage.run]
source = ["mdapy"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# the test helpers shared through pytest's pythonpath
known-local-folder = ["calculators", "lattices", "ovito_reference"]

[tool.ruff.format]
quote-style = "double"
