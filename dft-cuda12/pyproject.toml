# The package mdapy-dft-cuda12: the plane-wave DFT of MDAPY on NVIDIA GPUs, built
# with CUDA 12 from the sources of MDAPY one directory up. MDAPY loads it for its
# DFT calculator.

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "mdapy-dft-cuda12"
dynamic = ["version"]
description = "The plane-wave DFT of MDAPY on NVIDIA GPUs, with CUDA 12"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yongchao Wu", email = "934313174@qq.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/mushroomfire/mdapy"
Issues = "https://github.com/mushroomfire/mdapy/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = ".."
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["mdapy_dft_cuda12"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
MDAPY_DFT_ONLY = "ON"
MDAPY_CUDA_LINEINFO = "OFF"
# the machine code of the V100, A100, A-series, H100 and B200, double precision GPUs
CMAKE_CUDA_ARCHITECTURES = "70-real;80-real;86-real;90-real;100-real;100-virtual"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../src/mdapy/__init__.py"
regex = '__version__ = "(?P<value>[^"]+)"'

[[tool.scikit-build.generate]]
path = "mdapy_dft_cuda12/_version.py"
location = "install"
template = '''
__version__ = "${version}"
'''
